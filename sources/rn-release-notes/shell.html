<title>@@TITLE@@</title>
<style>
@@FACES@@:root{
  --font-body:'PretendardSub','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo',sans-serif;
  --font-mono:'JetBrainsMonoSub',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'PretendardSub',monospace;
  --fs:18px; --fs-code:16px; --lh:1.85; --ls:-.003em; --measure:780px; --lh-code:1.68;
  --bg:#ffffff; --bg-soft:#f6f7f9; --panel:#f4f5f7; --border:#e3e6ea;
  --text:#1c1e21; --muted:#606770; --accent:#087ea4; --accent-soft:#e7f4f9;
  --code-bg:#f6f7f9; --code-text:#24292f; --kw:#cf222e; --str:#0a5f2c; --com:#6e7781; --num:#0550ae; --tag:#116329; --attr:#8250df;
  --add-bg:#e6ffec; --add-text:#0a5f2c; --del-bg:#ffebe9; --del-text:#a40e26;
  --info-bg:#eef6fb; --info-border:#4aa3c7; --warn-bg:#fff8e6; --warn-border:#d9a441;
  --shadow:0 8px 28px rgba(0,0,0,.14);
}
@@DARK@@
*{box-sizing:border-box}
html{font-size:var(--fs); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
  font-size:1rem; line-height:var(--lh); letter-spacing:var(--ls);
  word-break:keep-all; overflow-wrap:anywhere; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
.wrap{max-width:var(--measure); margin:0 auto; padding:0 20px 96px}
header.post{padding-block:56px 28px; border-bottom:1px solid var(--border)}
.kicker{display:inline-block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent);
  background:var(--accent-soft); border-radius:999px; padding:5px 12px; font-weight:700; margin-bottom:18px}
h1{font-size:2.1rem; line-height:1.3; margin:0 0 14px; letter-spacing:-.02em}
.meta{color:var(--muted); font-size:.92rem; margin:0 0 6px}
.orig-title{color:var(--muted); font-size:.95rem; margin:6px 0 0; font-weight:500}
.source{font-size:.9rem; margin:14px 0 0}
.source a{color:var(--accent)}
.authors{display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:26px}
.author{display:flex; align-items:center; gap:9px; min-width:0}
.author img{width:34px; height:34px; border-radius:50%; flex:0 0 auto; background:var(--panel)}
.author .n{font-size:.86rem; font-weight:650; line-height:1.25}
.author .a{font-size:.76rem; color:var(--muted); line-height:1.25}
.lead{margin-top:32px}
h2{font-size:1.6rem; margin:56px 0 18px; padding-bottom:10px; border-bottom:2px solid var(--border); letter-spacing:-.015em}
h3{font-size:1.24rem; margin:40px 0 12px; letter-spacing:-.01em}
h4{font-size:1.02rem; margin:28px 0 10px; color:var(--muted); letter-spacing:.01em}
p{margin:0 0 18px}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
ul{padding-left:22px; margin:0 0 18px}
ol{padding-left:24px; margin:0 0 18px}
li{margin:8px 0}
li > ul, li > ol{margin-top:8px}
hr{border:0; border-top:1px solid var(--border); margin:40px 0}
code{font-family:var(--font-mono); font-size:var(--fs-code); letter-spacing:0}
p code, li code, td code, .nodes code{background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:1px 5px}
h1 code, h2 code, h3 code, h4 code{font-size:.9em}
.codeblock{margin:0 0 22px; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--code-bg)}
.codeblock .fname{font-family:var(--font-mono); font-size:calc(var(--fs-code) * .86); color:var(--muted);
  padding:8px 14px; border-bottom:1px solid var(--border); background:var(--bg-soft)}
.codeblock pre{margin:0; padding:16px 18px; overflow-x:auto; font-size:var(--fs-code); line-height:var(--lh-code);
  color:var(--code-text); letter-spacing:0}
.codeblock pre code{font-size:inherit; background:none; border:0; padding:0}
.kw{color:var(--kw)} .str{color:var(--str)} .com{color:var(--com)} .num{color:var(--num)} .tag{color:var(--tag)} .attr{color:var(--attr)}
.add{display:block; background:var(--add-bg); color:var(--add-text); margin:0 -18px; padding:0 18px}
.del{display:block; background:var(--del-bg); color:var(--del-text); margin:0 -18px; padding:0 18px}
.toc{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; margin:28px 0 8px}
.toc section{background:var(--bg-soft); border:1px solid var(--border); border-radius:12px; padding:16px 18px}
.toc h3{margin:0 0 8px; font-size:1rem}
.toc ul{margin:0; padding-left:18px}
.toc li{margin:6px 0; font-size:.93rem}
.demos{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:22px 0 8px}
.demos figure{margin:0; background:var(--bg-soft); border:1px solid var(--border); border-radius:12px; padding:12px; text-align:center}
.demos img{max-width:100%; height:auto; border-radius:8px; display:block; margin:0 auto}
.demos figcaption{font-size:.85rem; color:var(--muted); font-weight:650; margin-bottom:10px}
figure.shot{margin:22px 0; text-align:center}
figure.shot img, figure.shot video{max-width:100%; height:auto; border:1px solid var(--border); border-radius:10px}
figure.shot figcaption{font-size:.82rem; color:var(--muted); margin-top:8px; line-height:1.6}
.admon{background:var(--info-bg); border-left:4px solid var(--info-border); border-radius:8px; padding:14px 18px; margin:22px 0}
.admon .t{font-size:.78rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--info-border); margin-bottom:6px}
.admon p{margin:0}
.admon p + p{margin-top:10px}
.admon.warn{background:var(--warn-bg); border-left-color:var(--warn-border)}
.admon.warn .t{color:var(--warn-border)}
.nodes{list-style:none; padding:0; margin:0 0 18px}
.nodes li{display:flex; gap:10px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--border); flex-wrap:wrap}
.nodes li:last-child{border-bottom:0}
.nodes .v{font-family:var(--font-mono); font-size:var(--fs-code); font-weight:700; min-width:150px}
.badge{font-size:.74rem; font-weight:800; border-radius:999px; padding:2px 9px; white-space:nowrap}
.ok{background:var(--add-bg); color:var(--add-text)}
.no{background:var(--del-bg); color:var(--del-text)}
.tblwrap{overflow-x:auto; margin:0 0 22px}
table{border-collapse:collapse; width:100%; font-size:.93rem}
th, td{border:1px solid var(--border); padding:9px 12px; text-align:left; vertical-align:top}
th{background:var(--bg-soft); font-weight:750}
.tags{margin-top:56px; padding-top:20px; border-top:1px solid var(--border); font-size:.88rem; color:var(--muted)}
.tags span{display:inline-block; background:var(--panel); border:1px solid var(--border); border-radius:999px; padding:3px 11px; margin-right:8px}
footer.note{margin-top:40px; font-size:.83rem; color:var(--muted); line-height:1.7}
details.fold{border:1px solid var(--border); border-radius:10px; padding:0 18px; margin:22px 0; background:var(--bg-soft)}
details.fold > summary{cursor:pointer; font-weight:750; padding:13px 0; font-size:.95rem; list-style:none; color:var(--text)}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::before{content:'\25B8'; display:inline-block; width:1em; margin-right:6px; color:var(--muted); transition:transform .15s}
details.fold[open] > summary::before{transform:rotate(90deg)}
details.fold[open] > summary{border-bottom:1px solid var(--border); margin-bottom:14px}
details.fold > *:last-child{margin-bottom:16px}
.admon.rich p{margin:0 0 12px}
.admon.rich > *:last-child{margin-bottom:0}
.steps{counter-reset:step; list-style:none; padding-left:0}
.steps > li{position:relative; padding-left:34px; margin:16px 0}
.steps > li::before{counter-increment:step; content:counter(step); position:absolute; left:0; top:2px; width:23px; height:23px;
  border-radius:50%; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:800;
  display:flex; align-items:center; justify-content:center; font-family:var(--font-body)}
/* ===== 글자 크기 조절 패널 ===== */
.prefs{position:fixed; top:14px; right:14px; z-index:99; font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif; letter-spacing:0}
.prefs .open{display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:11px; cursor:pointer;
  border:1px solid var(--border); background:var(--bg); color:var(--text); box-shadow:var(--shadow); font-size:15px; font-weight:800; padding:0}
.prefs .body{display:none; margin-top:8px; width:208px; background:var(--bg); border:1px solid var(--border);
  border-radius:12px; padding:11px 13px; box-shadow:var(--shadow)}
.prefs[data-open="1"] .body{display:block}
.prefs .row{display:flex; align-items:center; gap:7px; margin:7px 0}
.prefs .row > span{font-size:12px; color:var(--muted); flex:1}
.prefs .row > b{font-size:12px; font-variant-numeric:tabular-nums; min-width:26px; text-align:center}
.prefs .row button{width:28px; height:26px; border-radius:7px; cursor:pointer; border:1px solid var(--border);
  background:var(--bg-soft); color:var(--text); font-size:14px; font-weight:800; line-height:1; padding:0}
.prefs .row button:hover{border-color:var(--accent)}
.prefs .reset{width:100%; margin-top:8px; padding:6px 0; border-radius:8px; cursor:pointer; font-size:11.5px;
  border:1px solid var(--border); background:var(--bg-soft); color:var(--muted)}
.prefs .sample{font-family:var(--font-mono); font-size:var(--fs-code); color:var(--muted); margin-top:8px;
  padding-top:8px; border-top:1px solid var(--border); white-space:nowrap; overflow:hidden}
@media (max-width:820px){ .prefs{top:auto; bottom:14px; right:12px} .prefs .body{position:absolute; bottom:48px; right:0; margin:0} }
@media (max-width:640px){ .demos{grid-template-columns:1fr} h1{font-size:1.72rem} html{font-size:calc(var(--fs) - 1.5px)} }
@media print{ .prefs{display:none} }
</style>

@@CONTENT@@

<div class="prefs" id="prefs" data-open="0">
  <button class="open" id="prefsOpen" title="글자 크기" aria-label="글자 크기 설정">Aa</button>
  <div class="body">
    <div class="row"><span>본문 크기</span><button data-act="body-">−</button><b id="vBody">18</b><button data-act="body+">+</button></div>
    <div class="row"><span>코드 크기</span><button data-act="code-">−</button><b id="vCode">16</b><button data-act="code+">+</button></div>
    <div class="sample">const width = 100;</div>
    <button class="reset" id="prefsReset">기본값으로</button>
  </div>
</div>
<script>
(function(){
  var DEF={body:18,code:16}, KEY='rn-ko-typo';
  var st={body:DEF.body,code:DEF.code};
  var box=document.getElementById('prefs');
  var vb=document.getElementById('vBody'), vc=document.getElementById('vCode');
  try{var sv=JSON.parse(localStorage.getItem(KEY)||'null'); if(sv&&sv.body&&sv.code){st=sv;}}catch(e){}
  function clamp(v,lo,hi){return Math.min(hi,Math.max(lo,v));}
  function render(){
    var r=document.documentElement.style;
    r.setProperty('--fs',st.body+'px');
    r.setProperty('--fs-code',st.code+'px');
    vb.textContent=st.body; vc.textContent=st.code;
    try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}
  }
  box.addEventListener('click',function(e){
    var t=e.target.closest('button'); if(!t) return;
    var a=t.dataset.act;
    if(t.id==='prefsOpen'){ box.dataset.open = box.dataset.open==='1'?'0':'1'; return; }
    if(t.id==='prefsReset'){ st={body:DEF.body,code:DEF.code}; render(); return; }
    if(a==='body-') st.body=clamp(st.body-0.5,14,24);
    if(a==='body+') st.body=clamp(st.body+0.5,14,24);
    if(a==='code-') st.code=clamp(st.code-0.5,11,22);
    if(a==='code+') st.code=clamp(st.code+0.5,11,22);
    render();
  });
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var k=e.key;
    if(k==='+'||k==='='){ st.body=clamp(st.body+0.5,14,24); render(); }
    if(k==='-'||k==='_'){ st.body=clamp(st.body-0.5,14,24); render(); }
    if(k===']'){ st.code=clamp(st.code+0.5,11,22); render(); }
    if(k==='['){ st.code=clamp(st.code-0.5,11,22); render(); }
  });
  render();
})();
</script>
